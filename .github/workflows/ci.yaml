name: CI - DVC Pipeline & Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-gitops-values:
    # Keeps gitops/**/*.yaml in sync with the current sandbox account's
    # vpcId / account ID / role ARNs, rendered from `terraform output`.
    # needs: dvc-pipeline so this doesn't race dvc-pipeline's own git push
    # to main (both jobs commit to the repo; running in parallel risks a
    # non-fast-forward push failure or a lost commit).
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      AWS_REGION: us-west-2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main   # pick up dvc-pipeline's commit, not the stale triggering SHA

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init (reads existing remote state, no apply)
        working-directory: infrastructure
        run: terraform init

      - name: Render gitops templates from terraform output
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
          ./scripts/render-gitops.sh

      - name: Commit rendered gitops manifests if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add gitops/ infrastructure/.terraform.lock.hcl
          git diff --staged --quiet || git commit -m "Sync gitops manifests with current terraform outputs [skip ci]"
          git pull --rebase origin main
          git push

  dvc-pipeline:
    needs: sync-gitops-values   # so that gitops manifests are up-to-date before we push dvc.lock
    if: ${{ always() }}          # still run when the optional gitops sync cannot read Terraform state
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for OIDC auth to AWS (S3 access for DVC remote)
      contents: write   # required to commit dvc.lock back to the repo

    env:
      AWS_REGION: us-west-2
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install "dvc[s3]"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Resolve DVC remote bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="tourism-mlops-dvc-${ACCOUNT_ID}"
          echo "DVC_BUCKET=$BUCKET" >> "$GITHUB_ENV"

      - name: Point DVC at current remote
        run: dvc remote modify storage url "s3://${DVC_BUCKET}/dvc-store"

      - name: Pull cached data/models from DVC remote
        run: dvc pull -f || true   # ok if nothing cached yet on first run

      - name: Run DVC pipeline (build dataset + train)
        run: dvc repro

      - name: Push updated data/models to DVC remote
        run: dvc push

      - name: Show metrics
        run: dvc metrics show

      - name: Run smoke tests
        run: python tests/test_api.py

      - name: Commit dvc.lock and dvc config if changed # only for sandbox purpose
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dvc.lock .dvc/config
          git diff --staged --quiet || git commit -m "Update dvc.lock and DVC remote config [skip ci]"
          git push

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/tourism_model.joblib
            models/lookup_table.pkl
            models/metrics.json

  
  docker-build:
    # runs independently of dvc-pipeline / sync-gitops-values — it only
    # pushes an image to ECR, never commits to git, so there's no push
    # race to worry about here.
    
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: us-west-2
      ECR_REPOSITORY: india-tourism-api

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          tags: india-tourism-api:${{ github.sha }}
          load: true

      - name: Smoke test the built image
        run: |
          docker run -d -p 8000:8000 --name tourism-api india-tourism-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health
          docker logs tourism-api
          docker stop tourism-api

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker tag india-tourism-api:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker tag india-tourism-api:${{ github.sha }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest