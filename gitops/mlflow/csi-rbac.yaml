apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: csi-secrets-store-mlflow-secret-sync
  labels:
    app: secrets-store-csi-driver
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: csi-secrets-store-mlflow-secret-sync
  labels:
    app: secrets-store-csi-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: csi-secrets-store-mlflow-secret-sync
subjects:
  - kind: ServiceAccount
    name: secrets-store-csi-driver
    namespace: kube-system
