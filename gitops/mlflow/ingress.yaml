apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mlflow-strip-prefix
  namespace: mlflow
spec:
  stripPrefix:
    prefixes:
      - /mlflow
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mlflow-route
  namespace: mlflow
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/mlflow`)
      kind: Rule
      middlewares:
        - name: mlflow-strip-prefix
      services:
        - name: mlflow-server
          port: 5000