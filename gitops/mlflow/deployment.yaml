apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-server
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: mlflow-server }
  template:
    metadata:
      labels: { app: mlflow-server }
    spec:
      serviceAccountName: mlflow-sa   # IRSA-annotated, for S3 access
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.0
          command: ["mlflow", "server"]
          args:
            - "--backend-store-uri=$(BACKEND_STORE_URI)"
            - "--default-artifact-root=s3://sandbox-eks-mlflow-artifacts/"
            - "--host=0.0.0.0"
            - "--port=5000"
          envFrom:
            - secretRef: { name: mlflow-db-secret }
          ports: [{ containerPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-server
  namespace: mlflow
spec:
  selector: { app: mlflow-server }
  ports: [{ port: 5000, targetPort: 5000 }]