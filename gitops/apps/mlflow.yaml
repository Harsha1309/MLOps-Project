apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Harsha1309/MLOps-Project.git
    targetRevision: main
    path: gitops/charts/mlflow   # points at the folder with deployment.yaml, service.yaml, namespace.yaml, secretproviderclass.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true       # deletes resources removed from git
      selfHeal: true     # reverts manual kubectl changes back to git state
    syncOptions:
      - CreateNamespace=true